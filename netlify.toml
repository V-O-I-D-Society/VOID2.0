[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to Railway (must stay BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RAILWAY-DOMAIN.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA routing — serve index.html for all other paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
